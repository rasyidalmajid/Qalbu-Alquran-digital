<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qalbu - Baca Al-Quran & Jadwal Shalat</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS (CDN for HTML only setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        arabic: ['Amiri', 'serif'],
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            900: '#064e3b',
                            950: '#022c22',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Styling khusus untuk tipografi Arab */
        .font-arabic {
            font-family: 'Amiri', serif;
            line-height: 2.2;
        }

        /* Memperhalus tampilan scrollbar agar lebih menyatu dengan desain */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        /* Utilitas untuk card hover effect (jika dibutuhkan transisi ekstra) */
        .card-hover-fx {
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
        }

        .card-hover-fx:hover {
            transform: translateY(-2px);
        }
    </style>

</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-300 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50 w-full backdrop-blur-xl bg-slate-50/80 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/index.html" class="flex items-center gap-2 group">
                <i class="ph-fill ph-book-open-text text-2xl text-brand-600 dark:text-brand-500 group-hover:scale-110 transition-transform"></i>
                <span class="font-bold text-xl tracking-tight">Qalbu</span>
            </a>
            
            <!-- Menu Desktop -->
            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#" class="hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Al-Quran</a>
                <a href="/doa/home-doa.html" class="hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Doa Harian</a>
                <a href="#jadwal" class="hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Jadwal Shalat</a>
            </div>

            <div class="flex items-center gap-2">
                <!-- Theme Toggle -->
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle Dark Mode">
                    <i class="ph ph-moon text-xl dark:hidden"></i>
                    <i class="ph ph-sun text-xl hidden dark:block text-amber-400"></i>
                </button>

                <!-- Tombol Hamburger Mobile -->
                <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle Navigation Menu">
                    <i id="menu-icon-open" class="ph ph-list text-2xl"></i>
                    <i id="menu-icon-close" class="ph ph-x text-2xl hidden"></i>
                </button>
            </div>
        </div>

        <!-- Panel Menu Mobile (Collapse) -->
        <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 dark:border-slate-800 bg-slate-50/95 dark:bg-slate-950/95 backdrop-blur-xl px-4 pt-2 pb-4 space-y-1">
            <a href="#" class="mobile-nav-link block px-3 py-2 rounded-lg text-base font-medium hover:bg-slate-200/60 dark:hover:bg-slate-800/60 hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Al-Quran</a>
            <a href="/doa/home-doa.html" class="mobile-nav-link block px-3 py-2 rounded-lg text-base font-medium hover:bg-slate-200/60 dark:hover:bg-slate-800/60 hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Doa Harian</a>
            <a href="#jadwal" class="mobile-nav-link block px-3 py-2 rounded-lg text-base font-medium hover:bg-slate-200/60 dark:hover:bg-slate-800/60 hover:text-brand-600 dark:hover:text-brand-500 transition-colors">Jadwal Shalat</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="max-w-3xl mx-auto px-4 pt-24 pb-16 text-center">        
        <p class="text-slate-600 dark:text-slate-400 text-lg md:text-xl max-w-[50ch] mb-2 font-bold mx-auto leading-relaxed">
        Al-Qur'an Digital
    </p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <div class="relative w-full sm:w-auto">
                <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-surah" placeholder="Cari surah (mis: Yasin)..." class="w-full sm:w-72 pl-12 pr-4 py-3.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-full focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
            </div>
        </div>
    </header>

    <main class="flex-grow p-4">
        <!-- Surah Populer Grid -->
        <section id="quran" class="max-w-7xl mx-auto px-4 mb-24">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="surah-grid">
                <!-- Dihasilkan oleh JavaScript -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 mt-32 py-12">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <i class="ph-fill ph-book-open-text text-3xl text-slate-300 dark:text-slate-700 mb-4 inline-block"></i>
            <p class="font-medium">Qalbu.</p>
            <p class="text-slate-500 text-sm mt-2">Sumber teks Al-Quran dari API EQuran.id (Kemenag RI).</p>
            <p class="text-slate-500 text-sm mt-8">&copy; 2026 Dibangun untuk kenyamanan membaca.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
        initThemeToggle();
        fetchSurah();
    });

    let timeoutId;

    document.getElementById('search-surah').addEventListener('input', function(event) {
        clearTimeout(timeoutId);
        
        timeoutId = setTimeout(() => {
            searchSurah(event.target.value);
        }, 1000);
    });

    async function searchSurah(query){
        const grid = document.getElementById('surah-grid');
        try {
            const response = await fetch('https://equran.id/api/v2/surat');
            const data = await response.json();

            if (data.code === 200) {
                grid.innerHTML = '';

                const filteredSurah = data.data.filter(item => item.namaLatin.toLowerCase().includes(query.toLowerCase()));

                filteredSurah.forEach(surat => {
                    grid.innerHTML += `
                        <a href="/al-quran/detail-surah.html?nomor=${surat.nomor}" class="group bg-white dark:bg-slate-900 p-6 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center justify-between card-hover-fx hover:border-brand-500 dark:hover:border-brand-500 transition-colors">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-sm font-bold text-slate-500">
                                    ${surat.nomor}
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg group-hover:text-brand-600 dark:group-hover:text-brand-500 transition-colors">${surat.namaLatin}</h3>
                                    <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider">${surat.tempatTurun} • ${surat.jumlahAyat} Ayat</p>
                                </div>
                            </div>
                            <div class="font-arabic text-2xl text-brand-600 dark:text-brand-500 text-right">
                                ${surat.nama}
                            </div>
                        </a>
                    `;
                });
            }
        } catch (error) {
            grid.innerHTML = `<div class="col-span-1 md:col-span-3 text-center py-4 text-red-500">Gagal memuat data surah.</div>`;
            console.error('Error fetching surah:', error);
        }
    }

    function initThemeToggle() {
        const toggleBtn = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        // Cek preferensi sistem atau local storage
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }

        toggleBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            if (html.classList.contains('dark')) {
                localStorage.theme = 'dark';
            } else {
                localStorage.theme = 'light';
            }
        });
    }

    async function fetchSurah() {
        const grid = document.getElementById('surah-grid');
        
        try {
            const response = await fetch('https://equran.id/api/v2/surat');
            const data = await response.json();

            if (data.code === 200) {
                grid.innerHTML = '';

                data.data.forEach(surat => {
                    grid.innerHTML += `
                        <a href="/al-quran/detail-surah.html?nomor=${surat.nomor}" class="group bg-white dark:bg-slate-900 p-6 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center justify-between card-hover-fx hover:border-brand-500 dark:hover:border-brand-500 transition-colors">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-sm font-bold text-slate-500">
                                    ${surat.nomor}
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg group-hover:text-brand-600 dark:group-hover:text-brand-500 transition-colors">${surat.namaLatin}</h3>
                                    <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider">${surat.tempatTurun} • ${surat.jumlahAyat} Ayat</p>
                                </div>
                            </div>
                            <div class="font-arabic text-2xl text-brand-600 dark:text-brand-500 text-right">
                                ${surat.nama}
                            </div>
                        </a>
                    `;
                });
            }
        } catch (error) {
            grid.innerHTML = `<div class="col-span-1 md:col-span-3 text-center py-4 text-red-500">Gagal memuat data surah.</div>`;
            console.error('Error fetching surah:', error);
        }
    }

    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const iconOpen = document.getElementById('menu-icon-open');
    const iconClose = document.getElementById('menu-icon-close');
    const mobileLinks = document.querySelectorAll('.mobile-nav-link');

    // Toggle menu saat tombol diklik
    mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        iconOpen.classList.toggle('hidden');
        iconClose.classList.toggle('hidden');
    });

    // Otomatis tutup menu saat salah satu link diklik
    mobileLinks.forEach(link => {
        link.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
            iconOpen.classList.remove('hidden');
            iconClose.classList.add('hidden');
        });
    });
    </script>
</body>
</html>
